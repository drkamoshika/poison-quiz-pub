<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">

    <title>毒はある？生き物＆植物クイズ！</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --poison-color: #e74c3c;
            --safe-color: #2ecc71;
            --bg-color: #f4f6f8;
        }
        body {
            font-family: 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px 0;
            box-sizing: border-box;
        }
        .quiz-container {
            background-color: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
            padding: 25px;
            width: 90%;
            max-width: 520px;
            text-align: center;
            position: relative;
        }
        h1 {
            color: var(--primary-color);
            font-size: 20px;
            margin: 0 0 5px 0;
        }
        .score-board {
            font-size: 15px;
            color: #7f8c8d;
            margin-bottom: 10px;
            font-weight: bold;
        }
        .progress-bar-bg {
            width: 100%;
            height: 8px;
            background-color: #e9ecef;
            border-radius: 4px;
            margin-bottom: 15px;
            overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%;
            background-color: #3498db;
            width: 0%;
            transition: width 0.3s ease;
        }
        .image-wrapper {
            position: relative;
            width: 100%;
            height: 280px;
            border-radius: 12px;
            overflow: hidden;
            background-color: #222;
            margin-bottom: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .category-badge {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(0, 0, 0, 0.75);
            color: white;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            z-index: 10;
        }
        .image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: opacity 0.3s;
        }
        .loading-spinner {
            color: white;
            font-weight: bold;
            font-size: 14px;
        }
        .creature-name {
            font-size: 24px;
            font-weight: 900;
            margin-bottom: 20px;
            color: var(--primary-color);
        }
        .btn-container {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 15px;
        }
        .btn {
            flex: 1;
            padding: 14px 10px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 0 rgba(0,0,0,0.15);
        }
        .btn:active:not(:disabled) {
            transform: translateY(4px);
            box-shadow: 0 0 0 rgba(0,0,0,0.15);
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .btn-poison {
            background-color: var(--poison-color);
            color: white;
        }
        .btn-safe {
            background-color: var(--safe-color);
            color: white;
        }
        .result-container {
            margin-top: 15px;
            padding: 15px 20px;
            border-radius: 12px;
            display: none;
            animation: fadeIn 0.3s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .result-title {
            font-weight: 900;
            font-size: 22px;
            margin-bottom: 8px;
        }
        .correct {
            background-color: #d4edda;
            color: #155724;
            border-left: 5px solid #28a745;
        }
        .incorrect {
            background-color: #f8d7da;
            color: #721c24;
            border-left: 5px solid #dc3545;
        }
        .explanation {
            font-size: 13px;
            color: #333;
            text-align: left;
            line-height: 1.6;
            margin-bottom: 15px;
            max-height: 120px;
            overflow-y: auto;
        }

            width: 100%;
            padding: 14px;
            background-color: #34495e;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }
        .next-btn:hover, .restart-btn:hover {
            background-color: #2c3e50;
        }
    </style>
</head>

<div class="quiz-container">

            <button class="btn btn-safe" id="btn-safe" onclick="answer(false)">🟢 毒なし</button>
        </div>
        
        <div id="result" class="result-container">

            <div id="explanation-text" class="explanation"></div>
            <button class="next-btn" onclick="nextQuestion()">次の問題へ進む ➔</button>

    </div>
</div>

        { category: "虫・陸の生物 🐛", wikiTitle: "クワガタムシ", hasPoison: false, note: "大きなハサミがありますが毒はありません。" },
        { category: "虫・陸の生物 🐛", wikiTitle: "ハナアブ", hasPoison: false, note: "ハチにそっくりな擬態をしていますが、刺す針も毒も持たない安全なハエの仲間です。" },
        { category: "虫・陸の生物 🐛", wikiTitle: "カイコ", hasPoison: false, note: "シルクを生み出す蛾。無毒です。" },
        { category: "虫・陸の生物 🐛", wikiTitle: "アゲハチョウ", hasPoison: false, note: "綺麗な蝶。毒はありません。" },
        { category: "虫・陸の生物 🐛", wikiTitle: "ギフチョウ", hasPoison: false, note: "「春の女神」と呼ばれる無毒な蝶です。" },
        { category: "虫・陸の生物 🐛", wikiTitle: "カマキリ", hasPoison: false, note: "鎌で挟んできますが、毒はありません。" },
        { category: "虫・陸の生物 🐛", wikiTitle: "トノサマバッタ", hasPoison: false, note: "大型のバッタ。毒はありません。" },
        { category: "虫・陸の生物 🐛", wikiTitle: "セミ", hasPoison: false, note: "夏の風物詩。毒はありません。" },
        { category: "虫・陸の生物 🐛", wikiTitle: "ナナフシ", hasPoison: false, note: "枝そっくりの虫。毒はありません。" },
        { category: "虫・陸の生物 🐛", wikiTitle: "ハンミョウ", hasPoison: false, note: "道教えをする綺麗な甲虫。毒はありません。" }
    ];


    let currentQuestions = [];
    let currentQuestionIndex = 0;
    let score = 0;
    let currentWikiExtract = "";

    function shuffleArray(array) {
        const clone = [...array];
        for (let i = clone.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [clone[i], clone[j]] = [clone[j], clone[i]];
        }
        return clone;
    }

    function initQuiz() {
        const shuffled = shuffleArray(masterData);
        currentQuestions = shuffled.slice(0, 10); // 毎回ランダムに10問を抽出
        currentQuestionIndex = 0;
        score = 0;
        loadQuestion();
    }

    async function loadQuestion() {
        const currentQuiz = currentQuestions[currentQuestionIndex];
        
        document.getElementById('score-board').innerText = `第 ${currentQuestionIndex + 1} 問 / 全 ${currentQuestions.length} 問`;
        const progressPercent = (currentQuestionIndex / currentQuestions.length) * 100;
        document.getElementById('progress-bar').style.width = `${progressPercent}%`;

        document.getElementById('category-badge').innerText = currentQuiz.category;
        document.getElementById('creature-name').innerText = currentQuiz.wikiTitle;
        
        document.getElementById('loading').innerText = "画像を読み込み中...";
        document.getElementById('loading').style.display = 'block';
        document.getElementById('creature-img').style.display = 'none';
        document.getElementById('result').style.display = 'none';
        
        document.getElementById('btn-poison').disabled = true;
        document.getElementById('btn-safe').disabled = true;

        try {
            const response = await fetch(`https://ja.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(currentQuiz.wikiTitle)}`);
            const data = await response.json();

            if (data.thumbnail && data.thumbnail.source) {
                const imgElement = document.getElementById('creature-img');
                imgElement.src = data.thumbnail.source;
                imgElement.onload = () => {
                    document.getElementById('loading').style.display = 'none';
                    imgElement.style.display = 'block';
                };
            } else {
                document.getElementById('loading').innerText = '🖼 画像が見つかりませんでした';
            }

            currentWikiExtract = data.extract || "説明を取得できませんでした。";

            document.getElementById('btn-poison').disabled = false;
            document.getElementById('btn-safe').disabled = false;

        } catch (error) {
            console.error('Wikipedia API Error:', error);
            document.getElementById('loading').innerText = '⚠️ データの取得に失敗しました';
            document.getElementById('btn-poison').disabled = false;
            document.getElementById('btn-safe').disabled = false;
        }
    }

    function answer(userAnswer) {
        const currentQuiz = currentQuestions[currentQuestionIndex];
        const resultContainer = document.getElementById('result');
        const resultText = document.getElementById('result-text');
        const explanationText = document.getElementById('explanation-text');
        
        document.getElementById('btn-poison').disabled = true;
        document.getElementById('btn-safe').disabled = true;

        if (userAnswer === currentQuiz.hasPoison) {
            resultText.innerText = "⭕️ 大正解！";
            resultContainer.className = "result-container correct";
            score++;
        } else {
            resultText.innerText = "❌ ザンネン...";
            resultContainer.className = "result-container incorrect";
        }

        explanationText.innerHTML = `<strong>【ワンポイント】</strong> ${currentQuiz.note}<br><br><strong>【Wikipedia概要】</strong><br>${currentWikiExtract}`;
        resultContainer.style.display = 'block';
    }

    function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < currentQuestions.length) {
            loadQuestion();
        } else {
            showFinalResult();
        }
    }

    function showFinalResult() {
        document.getElementById('quiz-area').style.display = 'none';
        const finalResultArea = document.getElementById('final-result-area');
        finalResultArea.style.display = 'block';
        
        document.getElementById('final-score').innerText = `${score} / ${currentQuestions.length} 点`;
        
        let rankMsg = "";
        if (score === 10) {
            rankMsg = "🏆 満点！あなたは完璧な毒物・生き物マスターです！";
        } else if (score >= 7) {
            rankMsg = "🌟 すごい！自然界の危険を見事に見抜けています！";
        } else if (score >= 4) {
            rankMsg = "👍 まずまず！身近な生き物にも意外な毒があるから気をつけよう。";
        } else {
            rankMsg = "⚠️ 危険かも！？もう一度挑戦して覚えてみよう！";
        }
        document.getElementById('rank-message').innerText = rankMsg;
    }

    function restartQuiz() {
        document.getElementById('quiz-area').style.display = 'block';
        document.getElementById('final-result-area').style.display = 'none';
        initQuiz();
    }

    initQuiz();
</script>
